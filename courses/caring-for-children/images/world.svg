<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="440" viewBox="0 0 1024 440" role="img" aria-labelledby="title desc"><title id="title">Meet the child in their world</title><desc id="desc">Notice: Name what happened; Keep guesses tentative. Invite: Offer space to respond; Silence is an option. Adjust: Let the child correct you; Keep adult responsibility</desc><rect width="1024" height="440" fill="#f4f7fa"/><text x="35" y="62" font-family="Arial,sans-serif" font-size="28" fill="#163348">Meet the child in their world</text><rect x="35" y="108" width="300" height="245" rx="18" fill="#dcefed"/><text x="55" y="159" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#163348">Notice</text><text x="55" y="215" font-family="Arial,sans-serif" font-size="17" fill="#163348">Name what happened</text><text x="55" y="265" font-family="Arial,sans-serif" font-size="16" fill="#163348">Keep guesses tentative</text><rect x="357" y="108" width="300" height="245" rx="18" fill="#e5eaf9"/><text x="377" y="159" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#163348">Invite</text><text x="377" y="215" font-family="Arial,sans-serif" font-size="17" fill="#163348">Offer space to respond</text><text x="377" y="265" font-family="Arial,sans-serif" font-size="16" fill="#163348">Silence is an option</text><rect x="679" y="108" width="300" height="245" rx="18" fill="#f6ebd7"/><text x="699" y="159" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#163348">Adjust</text><text x="699" y="215" font-family="Arial,sans-serif" font-size="17" fill="#163348">Let the child correct you</text><text x="699" y="265" font-family="Arial,sans-serif" font-size="16" fill="#163348">Keep adult responsibility</text><text x="35" y="401" font-family="Arial,sans-serif" font-size="16" fill="#415564">Caring for Children · Illustrative framework, not a guarantee or clinical protocol</text></svg>