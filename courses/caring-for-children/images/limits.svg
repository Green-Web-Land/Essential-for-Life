<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="440" viewBox="0 0 1024 440" role="img" aria-labelledby="title desc"><title id="title">Feelings and boundaries can coexist</title><desc id="desc">Acknowledge: You seem disappointed; Allow correction. Protect: We still need to leave; Care stays with the adult. Offer: Shelf or suitable box?; Only real, safe choices</desc><rect width="1024" height="440" fill="#f4f7fa"/><text x="35" y="62" font-family="Arial,sans-serif" font-size="28" fill="#163348">Feelings and boundaries can coexist</text><rect x="35" y="108" width="300" height="245" rx="18" fill="#dcefed"/><text x="55" y="159" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#163348">Acknowledge</text><text x="55" y="215" font-family="Arial,sans-serif" font-size="17" fill="#163348">You seem disappointed</text><text x="55" y="265" font-family="Arial,sans-serif" font-size="16" fill="#163348">Allow correction</text><rect x="357" y="108" width="300" height="245" rx="18" fill="#e5eaf9"/><text x="377" y="159" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#163348">Protect</text><text x="377" y="215" font-family="Arial,sans-serif" font-size="17" fill="#163348">We still need to leave</text><text x="377" y="265" font-family="Arial,sans-serif" font-size="16" fill="#163348">Care stays with the adult</text><rect x="679" y="108" width="300" height="245" rx="18" fill="#f6ebd7"/><text x="699" y="159" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#163348">Offer</text><text x="699" y="215" font-family="Arial,sans-serif" font-size="17" fill="#163348">Shelf or suitable box?</text><text x="699" y="265" font-family="Arial,sans-serif" font-size="16" fill="#163348">Only real, safe choices</text><text x="35" y="401" font-family="Arial,sans-serif" font-size="16" fill="#415564">Caring for Children · Illustrative framework, not a guarantee or clinical protocol</text></svg>