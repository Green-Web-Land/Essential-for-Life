<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="440" viewBox="0 0 1024 440" role="img" aria-labelledby="title desc"><title id="title">Repair without asking the child to fix you</title><desc id="desc">Own the action: I shouted. I am sorry.; No blame attached. Make a change: I will pause before speaking.; Follow through. Allow a response: You need not answer now.; No required hug</desc><rect width="1024" height="440" fill="#f4f7fa"/><text x="35" y="62" font-family="Arial,sans-serif" font-size="28" fill="#163348">Repair without asking the child to fix you</text><rect x="35" y="108" width="300" height="245" rx="18" fill="#dcefed"/><text x="55" y="159" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#163348">Own the action</text><text x="55" y="215" font-family="Arial,sans-serif" font-size="17" fill="#163348">I shouted. I am sorry.</text><text x="55" y="265" font-family="Arial,sans-serif" font-size="16" fill="#163348">No blame attached</text><rect x="357" y="108" width="300" height="245" rx="18" fill="#e5eaf9"/><text x="377" y="159" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#163348">Make a change</text><text x="377" y="215" font-family="Arial,sans-serif" font-size="17" fill="#163348">I will pause before speaking.</text><text x="377" y="265" font-family="Arial,sans-serif" font-size="16" fill="#163348">Follow through</text><rect x="679" y="108" width="300" height="245" rx="18" fill="#f6ebd7"/><text x="699" y="159" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#163348">Allow a response</text><text x="699" y="215" font-family="Arial,sans-serif" font-size="17" fill="#163348">You need not answer now.</text><text x="699" y="265" font-family="Arial,sans-serif" font-size="16" fill="#163348">No required hug</text><text x="35" y="401" font-family="Arial,sans-serif" font-size="16" fill="#415564">Caring for Children · Illustrative framework, not a guarantee or clinical protocol</text></svg>