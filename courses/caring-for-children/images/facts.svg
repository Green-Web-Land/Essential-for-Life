<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="440" viewBox="0 0 1024 440" role="img" aria-labelledby="title desc"><title id="title">Facts are not motives</title><desc id="desc">Observation: Said: Too loud; Use supplied information. Possibility: A quieter place may help; Offer, then check. Unknown: Why noise mattered; Do not invent a diagnosis</desc><rect width="1024" height="440" fill="#f4f7fa"/><text x="35" y="62" font-family="Arial,sans-serif" font-size="28" fill="#163348">Facts are not motives</text><rect x="35" y="108" width="300" height="245" rx="18" fill="#dcefed"/><text x="55" y="159" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#163348">Observation</text><text x="55" y="215" font-family="Arial,sans-serif" font-size="17" fill="#163348">Said: Too loud</text><text x="55" y="265" font-family="Arial,sans-serif" font-size="16" fill="#163348">Use supplied information</text><rect x="357" y="108" width="300" height="245" rx="18" fill="#e5eaf9"/><text x="377" y="159" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#163348">Possibility</text><text x="377" y="215" font-family="Arial,sans-serif" font-size="17" fill="#163348">A quieter place may help</text><text x="377" y="265" font-family="Arial,sans-serif" font-size="16" fill="#163348">Offer, then check</text><rect x="679" y="108" width="300" height="245" rx="18" fill="#f6ebd7"/><text x="699" y="159" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#163348">Unknown</text><text x="699" y="215" font-family="Arial,sans-serif" font-size="17" fill="#163348">Why noise mattered</text><text x="699" y="265" font-family="Arial,sans-serif" font-size="16" fill="#163348">Do not invent a diagnosis</text><text x="35" y="401" font-family="Arial,sans-serif" font-size="16" fill="#415564">Caring for Children · Illustrative framework, not a guarantee or clinical protocol</text></svg>