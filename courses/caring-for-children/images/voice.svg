<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="440" viewBox="0 0 1024 440" role="img" aria-labelledby="title desc"><title id="title">A sustainable plan keeps the child’s voice</title><desc id="desc">Ask: What would help?; An invitation, not a test. Make it feasible: Keep necessary boundaries; Adults arrange support. Review: What should change?; Compliance is not the score</desc><rect width="1024" height="440" fill="#f4f7fa"/><text x="35" y="62" font-family="Arial,sans-serif" font-size="28" fill="#163348">A sustainable plan keeps the child’s voice</text><rect x="35" y="108" width="300" height="245" rx="18" fill="#dcefed"/><text x="55" y="159" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#163348">Ask</text><text x="55" y="215" font-family="Arial,sans-serif" font-size="17" fill="#163348">What would help?</text><text x="55" y="265" font-family="Arial,sans-serif" font-size="16" fill="#163348">An invitation, not a test</text><rect x="357" y="108" width="300" height="245" rx="18" fill="#e5eaf9"/><text x="377" y="159" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#163348">Make it feasible</text><text x="377" y="215" font-family="Arial,sans-serif" font-size="17" fill="#163348">Keep necessary boundaries</text><text x="377" y="265" font-family="Arial,sans-serif" font-size="16" fill="#163348">Adults arrange support</text><rect x="679" y="108" width="300" height="245" rx="18" fill="#f6ebd7"/><text x="699" y="159" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#163348">Review</text><text x="699" y="215" font-family="Arial,sans-serif" font-size="17" fill="#163348">What should change?</text><text x="699" y="265" font-family="Arial,sans-serif" font-size="16" fill="#163348">Compliance is not the score</text><text x="35" y="401" font-family="Arial,sans-serif" font-size="16" fill="#415564">Caring for Children · Illustrative framework, not a guarantee or clinical protocol</text></svg>