<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="1000" height="500" fill="#f5f9fc"/><g fill="#162f40" font-family="Arial,sans-serif"><text x="35" y="52" font-size="30">Before a financial decision</text><rect x="35" y="120" width="440" height="110" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="53" y="158" font-size="23">Identify the issue</text><text x="53" y="190" font-size="23">What is known and what is missing?</text><rect x="525" y="120" width="440" height="110" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="543" y="158" font-size="23">Verify the source</text><text x="543" y="190" font-size="23">Use an independent route</text><rect x="35" y="270" width="440" height="110" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="53" y="308" font-size="23">Ask about consequences</text><text x="53" y="340" font-size="23">Full costs, timing and conditions</text><rect x="525" y="270" width="440" height="110" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="543" y="308" font-size="23">Decide or seek help</text><text x="543" y="340" font-size="23">No need to act under pressure</text><text x="35" y="460" font-size="23">General education cannot settle an individual's circumstances.</text></g></svg>

