<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="1000" height="500" fill="#f5f9fc"/><g fill="#162f40" font-family="Arial,sans-serif"><text x="35" y="52" font-size="30">Two years of interest: fictional CAD</text><rect x="35" y="120" width="440" height="150" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="53" y="158" font-size="23">Simple interest</text><text x="53" y="190" font-size="23">Year 1: 1,050.00</text><text x="53" y="222" font-size="23">Year 2: 1,100.00</text><rect x="525" y="120" width="440" height="150" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="543" y="158" font-size="23">Annual compounding</text><text x="543" y="190" font-size="23">Year 1: 1,050.00</text><text x="543" y="222" font-size="23">Year 2: 1,102.50</text><text x="35" y="335" font-size="23">Start 1,000; constant 5% yearly; two complete years.</text><text x="35" y="390" font-size="23">No movements, fees or tax. Compound once at each year-end.</text><text x="35" y="453" font-size="25">Difference: 2.50. These are not market offers.</text></g></svg>

