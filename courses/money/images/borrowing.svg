<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="1000" height="500" fill="#f5f9fc"/><g fill="#162f40" font-family="Arial,sans-serif"><text x="35" y="52" font-size="30">Compare all stated costs: fictional CAD</text><rect x="35" y="115" width="440" height="150" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="53" y="153" font-size="23">A: 600 principal</text><text x="53" y="185" font-size="23">36 interest + 12 fee</text><text x="53" y="217" font-size="23">Total due: 648</text><rect x="525" y="115" width="440" height="150" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="543" y="153" font-size="23">B: 600 principal</text><text x="543" y="185" font-size="23">24 interest + 30 fee</text><text x="543" y="217" font-size="23">Total due: 654</text><text x="35" y="325" font-size="23">Both advance 600 now; everything is due one year later.</text><text x="35" y="370" font-size="23">Simple annual interest: A 6%, B 4%; no other charges.</text><text x="35" y="415" font-size="23">Rates exclude fees; not all-in APR. No interim payments.</text><text x="35" y="465" font-size="25">Lower total cost does not establish affordability.</text></g></svg>

