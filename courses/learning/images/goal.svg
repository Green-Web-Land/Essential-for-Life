<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Make the next task checkable"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#356b85"/></marker></defs><rect width="1000" height="500" fill="#f2f8fa"/><text x="35" y="50" font-family="Arial,sans-serif" font-size="30" fill="#203b49">Make the next task checkable</text><rect x="40" y="160" width="260" height="100" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="56" y="202" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Choose one task</text><rect x="370" y="160" width="260" height="100" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="386" y="202" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Make an attempt</text><rect x="700" y="160" width="260" height="100" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="716" y="202" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Check the criteria</text><line x1="300" y1="210" x2="370" y2="210" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><line x1="630" y1="210" x2="700" y2="210" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="320" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Example: explain 3 out of 4, then check a new fraction.</text><text x="50" y="365" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Choose a smaller task or another response format when useful.</text><text x="50" y="420" font-family="Arial,sans-serif" font-size="20" fill="#203b49">A planning aid, not a test of motivation or intelligence.</text><text x="35" y="478" font-family="Arial,sans-serif" font-size="16" fill="#203b49">How to Learn and Check Information • Original teaching diagram</text></svg>
