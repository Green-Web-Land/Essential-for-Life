<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="A correction changes the comparison"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#356b85"/></marker></defs><rect width="1000" height="500" fill="#f2f8fa"/><text x="35" y="50" font-family="Arial,sans-serif" font-size="30" fill="#203b49">A correction changes the comparison</text><text x="40" y="95" font-family="Arial,sans-serif" font-size="20" fill="#203b49">Fictional final-project record; the denominator stays the same.</text><rect x="50" y="155" width="270" height="115" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="66" y="197" font-family="Arial,sans-serif" font-size="22" fill="#203b49">P originally: 12 / 20</text><text x="75" y="240" font-family="Arial,sans-serif" font-size="26" fill="#203b49">60%</text><rect x="365" y="155" width="270" height="115" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="381" y="197" font-family="Arial,sans-serif" font-size="22" fill="#203b49">P corrected: 10 / 20</text><text x="390" y="240" font-family="Arial,sans-serif" font-size="26" fill="#203b49">50%</text><rect x="690" y="155" width="260" height="115" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="706" y="197" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Q unchanged: 8 / 10</text><text x="720" y="240" font-family="Arial,sans-serif" font-size="26" fill="#203b49">80%</text><line x1="320" y1="212" x2="365" y2="212" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="330" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Corrected Q minus P: 80% − 50% = 30 percentage points.</text><text x="65" y="378" font-family="Arial,sans-serif" font-size="22" fill="#203b49">P's rate changes by −10 percentage points.</text><text x="65" y="429" font-family="Arial,sans-serif" font-size="20" fill="#203b49">No causal or lifelong benefit is established by this packet.</text><text x="35" y="478" font-family="Arial,sans-serif" font-size="16" fill="#203b49">How to Learn and Check Information • Original teaching diagram</text></svg>
