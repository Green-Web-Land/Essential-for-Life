<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Three reports, one fictional record"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#356b85"/></marker></defs><rect width="1000" height="500" fill="#f2f8fa"/><text x="35" y="50" font-family="Arial,sans-serif" font-size="30" fill="#203b49">Three reports, one fictional record</text><rect x="60" y="140" width="260" height="90" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="76" y="182" font-family="Arial,sans-serif" font-size="22" fill="#203b49">B: repeats A</text><rect x="390" y="140" width="240" height="90" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="406" y="182" font-family="Arial,sans-serif" font-size="22" fill="#203b49">A: original 12</text><rect x="700" y="140" width="260" height="90" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="716" y="182" font-family="Arial,sans-serif" font-size="22" fill="#203b49">C: corrects to 10</text><line x1="320" y1="185" x2="390" y2="185" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><line x1="700" y1="185" x2="630" y2="185" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="300" font-family="Arial,sans-serif" font-size="22" fill="#203b49">B adds no independent observation.</text><text x="70" y="345" font-family="Arial,sans-serif" font-size="22" fill="#203b49">C revises A; it does not create another trial.</text><text x="70" y="410" font-family="Arial,sans-serif" font-size="20" fill="#203b49">Arrows identify which record is repeated or corrected.</text><text x="35" y="478" font-family="Arial,sans-serif" font-size="16" fill="#203b49">How to Learn and Check Information • Original teaching diagram</text></svg>
