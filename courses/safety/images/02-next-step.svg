<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Pause is not a delay in urgent help</title><desc id="desc">BEFORE A ROUTINE ACTIVITY: Instructions are missing.: Leave the device unused.: Ask its responsible operator.. ALREADY OUTSIDE A FIRE: Flames are visible inside.: Emergency help from safety now.: Do not re-enter to investigate.</desc><rect width="1000" height="500" fill="#f4f7fb"/><g font-family="Arial, sans-serif" fill="#172a45"><text x="35" y="56" font-size="32" font-weight="bold">Pause is not a delay in urgent help</text><text x="35" y="91" font-size="20">Two examples, not a universal triage procedure</text><rect x="35" y="145" width="455" height="235" rx="12" fill="#ffffff" stroke="#426589"/><text x="49" y="187" font-size="22" font-weight="bold">BEFORE A ROUTINE ACTIVITY</text><text x="49" y="235" font-size="22">Instructions are missing.</text><text x="49" y="272" font-size="22">Leave the device unused.</text><text x="49" y="309" font-size="22">Ask its responsible operator.</text><rect x="505" y="145" width="455" height="235" rx="12" fill="#ffffff" stroke="#426589"/><text x="519" y="187" font-size="22" font-weight="bold">ALREADY OUTSIDE A FIRE</text><text x="519" y="235" font-size="22">Flames are visible inside.</text><text x="519" y="272" font-size="22">Emergency help from safety now.</text><text x="519" y="309" font-size="22">Do not re-enter to investigate.</text><text x="35" y="444" font-size="20">Do not wait for a checklist, proof or AI approval in an emergency.</text><text x="35" y="479" font-size="15">Everyday Safety and Getting Help · Original educational diagram · CC BY 4.0</text></g></svg>

