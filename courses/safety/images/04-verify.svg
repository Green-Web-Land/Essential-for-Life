<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">A claimed identity is not proof</title><desc id="desc">MESSAGE CLAIM: A name, logo or number: does not establish identity.: Do not disclose the code.. SEPARATE CONTACT: Use a genuine prior statement: or independently established: official contact source.. VERIFY THE REQUEST: Ask the real provider.: Do not use the suspicious: message as your source.</desc><rect width="1000" height="500" fill="#f4f7fb"/><g font-family="Arial, sans-serif" fill="#172a45"><text x="35" y="56" font-size="32" font-weight="bold">A claimed identity is not proof</text><text x="35" y="91" font-size="20">Fictional provider message</text><rect x="35" y="145" width="300" height="235" rx="12" fill="#ffffff" stroke="#426589"/><text x="49" y="187" font-size="20" font-weight="bold">MESSAGE CLAIM</text><text x="49" y="235" font-size="18">A name, logo or number</text><text x="49" y="272" font-size="18">does not establish identity.</text><text x="49" y="309" font-size="18">Do not disclose the code.</text><rect x="350" y="145" width="300" height="235" rx="12" fill="#ffffff" stroke="#426589"/><text x="364" y="187" font-size="20" font-weight="bold">SEPARATE CONTACT</text><text x="364" y="235" font-size="18">Use a genuine prior statement</text><text x="364" y="272" font-size="18">or independently established</text><text x="364" y="309" font-size="18">official contact source.</text><rect x="665" y="145" width="300" height="235" rx="12" fill="#ffffff" stroke="#426589"/><text x="679" y="187" font-size="20" font-weight="bold">VERIFY THE REQUEST</text><text x="679" y="235" font-size="18">Ask the real provider.</text><text x="679" y="272" font-size="18">Do not use the suspicious</text><text x="679" y="309" font-size="18">message as your source.</text><text x="35" y="444" font-size="20">No practice messages, calls, links or secret codes are required.</text><text x="35" y="479" font-size="15">Everyday Safety and Getting Help · Original educational diagram · CC BY 4.0</text></g></svg>

