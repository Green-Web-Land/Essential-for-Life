<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Notice without guessing</title><desc id="desc">OBSERVATION: The cord covering is split.: A supplied visible detail.. UNCERTAINTY: Its internal condition is unknown.: Missing facts are not a safety pass.. NEXT STEP: Leave it unused; seek suitable help.: No test or repair exercise.</desc><rect width="1000" height="500" fill="#f4f7fb"/><g font-family="Arial, sans-serif" fill="#172a45"><text x="35" y="56" font-size="32" font-weight="bold">Notice without guessing</text><text x="35" y="91" font-size="20">Three statements, three different jobs</text><rect x="35" y="145" width="300" height="235" rx="12" fill="#ffffff" stroke="#426589"/><text x="49" y="187" font-size="20" font-weight="bold">OBSERVATION</text><text x="49" y="235" font-size="18">The cord covering is split.</text><text x="49" y="272" font-size="18">A supplied visible detail.</text><rect x="350" y="145" width="300" height="235" rx="12" fill="#ffffff" stroke="#426589"/><text x="364" y="187" font-size="20" font-weight="bold">UNCERTAINTY</text><text x="364" y="235" font-size="18">Its internal condition is unknown.</text><text x="364" y="272" font-size="18">Missing facts are not a safety pass.</text><rect x="665" y="145" width="300" height="235" rx="12" fill="#ffffff" stroke="#426589"/><text x="679" y="187" font-size="20" font-weight="bold">NEXT STEP</text><text x="679" y="235" font-size="18">Leave it unused; seek suitable help.</text><text x="679" y="272" font-size="18">No test or repair exercise.</text><text x="35" y="444" font-size="20">Fictional learning aid. A checklist cannot establish safety.</text><text x="35" y="479" font-size="15">Everyday Safety and Getting Help · Original educational diagram · CC BY 4.0</text></g></svg>

