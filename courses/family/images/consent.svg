<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="1000" height="500" fill="#f4f7fb"/><text x="50" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#18334d">Permission is specific</text><rect x="50" y="110" width="425" height="92" rx="12" fill="#dceaf5"/><text x="70" y="164" font-family="Arial,sans-serif" font-size="25" fill="#18334d">1. Name the action</text><rect x="525" y="110" width="425" height="92" rx="12" fill="#dceaf5"/><text x="545" y="164" font-family="Arial,sans-serif" font-size="25" fill="#18334d">2. Ask without pressure</text><rect x="50" y="235" width="425" height="92" rx="12" fill="#dceaf5"/><text x="70" y="289" font-family="Arial,sans-serif" font-size="25" fill="#18334d">3. Respect the answer</text><rect x="525" y="235" width="425" height="92" rx="12" fill="#dceaf5"/><text x="545" y="289" font-family="Arial,sans-serif" font-size="25" fill="#18334d">4. No permission? Stop.</text><text x="50" y="415" font-family="Arial,sans-serif" font-size="24" fill="#18334d">A previous yes does not cover every later use.</text><text x="50" y="460" font-family="Arial,sans-serif" font-size="18" fill="#455971">Family Relationships · Original teaching diagram · Not a safety assessment</text></svg>
