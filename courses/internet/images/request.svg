<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#285e78"/></marker></defs><rect width="1000" height="500" fill="#f5f9fc"/><g fill="#162f40" font-family="Arial,sans-serif"><text x="35" y="52" font-size="30">A simplified request and response</text><rect x="35" y="190" width="220" height="90" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="53" y="228" font-size="23">Device</text><rect x="385" y="190" width="230" height="90" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="403" y="228" font-size="23">Networks</text><rect x="745" y="190" width="220" height="90" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="763" y="228" font-size="23">Service</text><path d="M255 170 L740 170" fill="none" stroke="#285e78" stroke-width="3" marker-end="url(#a)"/><text x="380" y="145" font-size="25">Request →</text><path d="M745 315 L260 315" fill="none" stroke="#285e78" stroke-width="3" marker-end="url(#a)"/><text x="385" y="355" font-size="25">← Response</text><text x="35" y="425" font-size="23">One page can request resources from several services.</text><text x="35" y="463" font-size="23">A failure does not by itself identify where the problem is.</text></g></svg>

