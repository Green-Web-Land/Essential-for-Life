<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#285e78"/></marker></defs><rect width="1000" height="500" fill="#f5f9fc"/><g fill="#162f40" font-family="Arial,sans-serif"><text x="35" y="52" font-size="30">Moving files and keeping them in step</text><rect x="35" y="160" width="245" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="53" y="198" font-size="23">Your device</text><rect x="710" y="160" width="250" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="728" y="198" font-size="23">Cloud service</text><path d="M285 140 L705 140" fill="none" stroke="#285e78" stroke-width="3" marker-end="url(#a)"/><text x="420" y="113" font-size="25">Upload →</text><path d="M705 295 L285 295" fill="none" stroke="#285e78" stroke-width="3" marker-end="url(#a)"/><text x="400" y="335" font-size="25">← Download</text><text x="35" y="398" font-size="23">Sync can carry changes in both directions, including deletions.</text><text x="35" y="455" font-size="25">A backup needs a recovery plan you can rely on.</text></g></svg>

