<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#285e78"/></marker></defs><rect width="1000" height="500" fill="#f5f9fc"/><g fill="#162f40" font-family="Arial,sans-serif"><text x="35" y="52" font-size="30">Before you write a conclusion</text><rect x="35" y="120" width="440" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="53" y="158" font-size="23">Who?</text><text x="53" y="190" font-size="23">Author and purpose</text><rect x="525" y="120" width="440" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="543" y="158" font-size="23">When?</text><text x="543" y="190" font-size="23">Relevant date and updates</text><rect x="35" y="250" width="440" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="53" y="288" font-size="23">What evidence?</text><text x="53" y="320" font-size="23">Original source or repeated claim?</text><rect x="525" y="250" width="440" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="543" y="288" font-size="23">What remains unknown?</text><text x="543" y="320" font-size="23">State the limit; do not fill the gap</text><text x="35" y="427" font-size="26">Write: answer + source + reason + uncertainty.</text><text x="35" y="467" font-size="22">Several copies of one notice are not independent confirmation.</text></g></svg>

