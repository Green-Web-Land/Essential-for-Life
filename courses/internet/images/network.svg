<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#285e78"/></marker></defs><rect width="1000" height="500" fill="#f5f9fc"/><g fill="#162f40" font-family="Arial,sans-serif"><text x="35" y="52" font-size="30">The Internet connects networks</text><rect x="35" y="140" width="230" height="110" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="53" y="178" font-size="23">Your device</text><text x="53" y="210" font-size="23">Browser or app</text><rect x="355" y="140" width="240" height="110" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="373" y="178" font-size="23">Local network</text><text x="373" y="210" font-size="23">Wi-Fi or cable</text><rect x="690" y="125" width="270" height="140" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="708" y="163" font-size="23">Internet networks</text><text x="708" y="195" font-size="23">connect to services</text><text x="708" y="227" font-size="23">Web, email, more</text><path d="M265 195 L350 195" fill="none" stroke="#285e78" stroke-width="3" marker-end="url(#a)"/><path d="M595 195 L685 195" fill="none" stroke="#285e78" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="320" width="450" height="90" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="53" y="358" font-size="23">Saved local file: may open offline</text><text x="35" y="461" font-size="23">A Wi-Fi connection alone does not prove Internet access.</text></g></svg>

