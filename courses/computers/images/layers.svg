<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#285e78"/></marker></defs><rect width="1000" height="500" fill="#f5f9fc"/><g font-family="Arial, sans-serif" fill="#162f40"><text x="40" y="55" font-size="30" font-weight="bold">Different parts do different jobs</text><path d="M320 200 H352" fill="none" stroke="#285e78" stroke-width="3" marker-end="url(#a)"/><path d="M640 200 H672" fill="none" stroke="#285e78" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="140" width="280" height="130" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="180" y="175" text-anchor="middle" font-size="23" font-weight="bold">Application</text><text x="180" y="204" text-anchor="middle" font-size="19">Writing, calculating,</text><text x="180" y="231" text-anchor="middle" font-size="19">browsing</text><rect x="360" y="140" width="280" height="130" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="500" y="175" text-anchor="middle" font-size="23" font-weight="bold">Operating system</text><text x="500" y="204" text-anchor="middle" font-size="19">Manages resources</text><text x="500" y="231" text-anchor="middle" font-size="19">and permissions</text><rect x="680" y="140" width="280" height="130" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="820" y="175" text-anchor="middle" font-size="23" font-weight="bold">Hardware</text><text x="820" y="204" text-anchor="middle" font-size="19">Processor, memory,</text><text x="820" y="231" text-anchor="middle" font-size="19">screen, storage</text><text x="40" y="420" font-size="20">A person uses an application to carry out a task.</text><text x="40" y="448" font-size="20">Simplified view: real systems exchange information in both directions.</text></g></svg>
