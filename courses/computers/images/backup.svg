<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#285e78"/></marker></defs><rect width="1000" height="500" fill="#f5f9fc"/><g font-family="Arial, sans-serif" fill="#162f40"><text x="40" y="55" font-size="30" font-weight="bold">Save, sync and backup are different</text><rect x="35" y="140" width="290" height="165" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="180" y="175" text-anchor="middle" font-size="23" font-weight="bold">Save</text><text x="180" y="204" text-anchor="middle" font-size="19">Working file</text><text x="180" y="231" text-anchor="middle" font-size="19">in a chosen location</text><rect x="355" y="140" width="290" height="165" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="500" y="175" text-anchor="middle" font-size="23" font-weight="bold">Sync</text><text x="500" y="204" text-anchor="middle" font-size="19">Locations kept in step</text><text x="500" y="231" text-anchor="middle" font-size="19">Deletion can spread</text><rect x="675" y="140" width="290" height="165" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="820" y="175" text-anchor="middle" font-size="23" font-weight="bold">Retained backup</text><text x="820" y="204" text-anchor="middle" font-size="19">A recovery copy</text><text x="820" y="231" text-anchor="middle" font-size="19">kept under a plan</text><text x="40" y="420" font-size="20">Recovery practice: restore fictional information to a separate location.</text><text x="40" y="448" font-size="20">Verify the recovered copy before relying on it; keep the original safe.</text></g></svg>
