<rect width="1000" height="500" fill="#f3f8fc"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#173852">Keep the kinds of statement separate</text>
<rect x="40" y="90" width="450" height="120" rx="15" fill="white" stroke="#7296b2" stroke-width="2"/><text x="60" y="130" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#174e76">Observation</text><text x="60" y="173" font-family="Arial,sans-serif" font-size="21" fill="#243b4b">The display read 18 cm.</text>
<rect x="510" y="90" width="450" height="120" rx="15" fill="white" stroke="#7296b2" stroke-width="2"/><text x="530" y="130" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#174e76">Hypothesis</text><text x="530" y="173" font-family="Arial,sans-serif" font-size="21" fill="#243b4b">Surface may explain distance.</text>
<rect x="40" y="235" width="450" height="120" rx="15" fill="white" stroke="#7296b2" stroke-width="2"/><text x="60" y="275" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#174e76">Prediction</text><text x="60" y="318" font-family="Arial,sans-serif" font-size="21" fill="#243b4b">Expect a shorter distance.</text>
<rect x="510" y="235" width="450" height="120" rx="15" fill="white" stroke="#7296b2" stroke-width="2"/><text x="530" y="275" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#174e76">Conditions matter</text><text x="530" y="318" font-family="Arial,sans-serif" font-size="21" fill="#243b4b">Specify a comparable check.</text>
<text x="40" y="418" font-family="Arial,sans-serif" font-size="22" fill="#243b4b">Fictional statements; labels alone do not make them true.</text>
