<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="A fictional distance model"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#356b85"/></marker></defs><rect width="1000" height="500" fill="#f2f8fa"/><text x="35" y="50" font-family="Arial,sans-serif" font-size="30" fill="#203b49">A fictional distance model</text><text x="35" y="92" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Paper scale: 2 cm per fictional distance unit.</text><line x1="100" y1="215" x2="860" y2="215" stroke="#356b85" stroke-width="3"/><circle cx="100" cy="215" r="10" fill="#23667e"/><text x="90" y="175" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Star</text><text x="83" y="260" font-family="Arial,sans-serif" font-size="18" fill="#203b49">0 u</text><text x="80" y="295" font-family="Arial,sans-serif" font-size="18" fill="#203b49">0 cm</text><circle cx="200" cy="215" r="10" fill="#23667e"/><text x="190" y="175" font-family="Arial,sans-serif" font-size="22" fill="#203b49">P</text><text x="183" y="260" font-family="Arial,sans-serif" font-size="18" fill="#203b49">1 u</text><text x="180" y="295" font-family="Arial,sans-serif" font-size="18" fill="#203b49">2 cm</text><circle cx="400" cy="215" r="10" fill="#23667e"/><text x="390" y="175" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Q</text><text x="383" y="260" font-family="Arial,sans-serif" font-size="18" fill="#203b49">3 u</text><text x="380" y="295" font-family="Arial,sans-serif" font-size="18" fill="#203b49">6 cm</text><circle cx="800" cy="215" r="10" fill="#23667e"/><text x="790" y="175" font-family="Arial,sans-serif" font-size="22" fill="#203b49">R</text><text x="783" y="260" font-family="Arial,sans-serif" font-size="18" fill="#203b49">7 u</text><text x="780" y="295" font-family="Arial,sans-serif" font-size="18" fill="#203b49">14 cm</text><text x="50" y="355" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Q to R: 4 units = 8 cm on this paper model.</text><text x="50" y="398" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Markers enlarged; not real planets or their current positions.</text><text x="50" y="435" font-family="Arial,sans-serif" font-size="19" fill="#203b49">On-screen display size varies. Use labels, not a ruler on the screen.</text><text x="35" y="478" font-family="Arial,sans-serif" font-size="16" fill="#203b49">Exploring the Cosmos • Original teaching diagram</text></svg>
