<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Our address in space"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#356b85"/></marker></defs><rect width="1000" height="500" fill="#f2f8fa"/><text x="35" y="50" font-family="Arial,sans-serif" font-size="30" fill="#203b49">Our address in space</text><text x="35" y="95" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Arrows mean “belongs within”, not travel direction.</text><rect x="40" y="195" width="190" height="100" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="56" y="253" font-family="Arial,sans-serif" font-size="24" fill="#203b49">Earth</text><line x1="230" y1="245" x2="280" y2="245" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><rect x="280" y="195" width="190" height="100" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="296" y="253" font-family="Arial,sans-serif" font-size="24" fill="#203b49">Solar system</text><line x1="470" y1="245" x2="520" y2="245" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><rect x="520" y="195" width="190" height="100" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="536" y="253" font-family="Arial,sans-serif" font-size="24" fill="#203b49">Milky Way</text><line x1="710" y1="245" x2="760" y2="245" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><rect x="760" y="195" width="190" height="100" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="776" y="253" font-family="Arial,sans-serif" font-size="24" fill="#203b49">Universe</text><text x="40" y="370" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Membership chain; object sizes and distances are not represented.</text><text x="40" y="413" font-family="Arial,sans-serif" font-size="22" fill="#203b49">The outer label does not establish a measured edge or wall.</text><text x="35" y="478" font-family="Arial,sans-serif" font-size="16" fill="#203b49">Exploring the Cosmos • Original teaching diagram</text></svg>
