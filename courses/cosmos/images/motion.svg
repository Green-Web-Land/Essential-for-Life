<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Orbit and rotation are different"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#356b85"/></marker></defs><rect width="1000" height="500" fill="#f2f8fa"/><text x="35" y="50" font-family="Arial,sans-serif" font-size="30" fill="#203b49">Orbit and rotation are different</text><circle cx="310" cy="260" r="140" fill="none" stroke="#9ab8c5" stroke-width="3"/><circle cx="310" cy="260" r="29" fill="#e9ba52"/><circle cx="450" cy="260" r="14" fill="#23667e"/><path d="M170 260 A140 140 0 0 1 310 120" fill="none" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><path d="M481 260 A31 31 0 1 0 450 291" fill="none" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><text x="285" y="312" font-family="Arial,sans-serif" font-size="18" fill="#203b49">Star</text><text x="490" y="245" font-family="Arial,sans-serif" font-size="20" fill="#203b49">Spin</text><text x="80" y="130" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Orbit</text><text x="585" y="150" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Orbit: the object's path.</text><text x="585" y="200" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Rotation: its turning.</text><text x="585" y="290" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Circle chosen for clarity.</text><text x="585" y="330" font-family="Arial,sans-serif" font-size="22" fill="#203b49">Not every orbit is circular.</text><text x="55" y="435" font-family="Arial,sans-serif" font-size="20" fill="#203b49">Schematic only: no speeds, periods or true physical sizes supplied.</text><text x="35" y="478" font-family="Arial,sans-serif" font-size="16" fill="#203b49">Exploring the Cosmos • Original teaching diagram</text></svg>
