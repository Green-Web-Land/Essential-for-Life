<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#285e78"/></marker></defs><rect width="1000" height="500" fill="#f5f9fc"/><g fill="#162f40" font-family="Arial,sans-serif"><text x="35" y="52" font-size="30">A feed is a selection</text><rect x="35" y="120" width="330" height="110" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="53" y="158" font-size="23">Possible inputs</text><text x="53" y="190" font-size="23">Activity and content details</text><rect x="450" y="120" width="220" height="110" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="468" y="158" font-size="23">Ranking</text><text x="468" y="190" font-size="23">Predictions</text><rect x="755" y="120" width="210" height="110" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="773" y="158" font-size="23">Selected</text><text x="773" y="190" font-size="23">feed</text><path d="M370 175 L445 175" fill="none" stroke="#285e78" stroke-width="3" marker-end="url(#a)"/><path d="M675 175 L750 175" fill="none" stroke="#285e78" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="285" width="930" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="53" y="323" font-size="23">Simplified model: systems, signals and controls differ.</text><text x="53" y="355" font-size="23">Seeing a claim often does not establish public agreement.</text><text x="35" y="455" font-size="23">Provider descriptions are not independent measurements.</text></g></svg>

