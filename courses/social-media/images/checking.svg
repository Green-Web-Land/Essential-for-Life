<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#285e78"/></marker></defs><rect width="1000" height="500" fill="#f5f9fc"/><g fill="#162f40" font-family="Arial,sans-serif"><text x="35" y="52" font-size="30">Check a post before repeating it</text><rect x="35" y="120" width="440" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="53" y="158" font-size="23">Claim</text><text x="53" y="190" font-size="23">What exactly is being asserted?</text><rect x="525" y="120" width="440" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="543" y="158" font-size="23">Source</text><text x="543" y="190" font-size="23">Who first supplied the evidence?</text><rect x="35" y="260" width="440" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="53" y="298" font-size="23">Context</text><text x="53" y="330" font-size="23">Do date, place and wording match?</text><rect x="525" y="260" width="440" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="543" y="298" font-size="23">Conclusion</text><text x="543" y="330" font-size="23">State support and remaining uncertainty</text><text x="35" y="450" font-size="23">Appearance alone cannot establish a post's origin or truth.</text></g></svg>

