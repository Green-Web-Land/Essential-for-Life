<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#285e78"/></marker></defs><rect width="1000" height="500" fill="#f5f9fc"/><g fill="#162f40" font-family="Arial,sans-serif"><text x="35" y="52" font-size="30">Intended audience is not the final audience</text><rect x="35" y="150" width="240" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="53" y="188" font-size="23">Your draft</text><rect x="365" y="150" width="250" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="383" y="188" font-size="23">Chosen viewers</text><rect x="705" y="150" width="260" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="723" y="188" font-size="23">Possible copies</text><path d="M280 200 L360 200" fill="none" stroke="#285e78" stroke-width="3" marker-end="url(#a)"/><path d="M620 200 L700 200" fill="none" stroke="#285e78" stroke-width="3" marker-end="url(#a)"/><text x="35" y="330" font-size="25">A recipient may copy or reshare content.</text><text x="35" y="390" font-size="23">Removing your post does not retrieve every other copy.</text><text x="35" y="450" font-size="23">Check identifying details before deciding to share.</text></g></svg>

