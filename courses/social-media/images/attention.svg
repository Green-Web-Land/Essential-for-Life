<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#285e78"/></marker></defs><rect width="1000" height="500" fill="#f5f9fc"/><g fill="#162f40" font-family="Arial,sans-serif"><text x="35" y="52" font-size="30">An adjustable attention plan</text><rect x="35" y="120" width="440" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="53" y="158" font-size="23">Start with a purpose</text><text x="53" y="190" font-size="23">Choose one useful task</text><rect x="525" y="120" width="440" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="543" y="158" font-size="23">Set a finish condition</text><text x="543" y="190" font-size="23">Know what is enough for this session</text><rect x="35" y="260" width="440" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="53" y="298" font-size="23">Review</text><text x="53" y="330" font-size="23">Did the task get done?</text><rect x="525" y="260" width="440" height="100" rx="14" fill="#e1eff5" stroke="#285e78" stroke-width="2"/><text x="543" y="298" font-size="23">Adjust</text><text x="543" y="330" font-size="23">What would help next time?</text><text x="35" y="450" font-size="23">A planning exercise, not a diagnosis or a universal time limit.</text></g></svg>

