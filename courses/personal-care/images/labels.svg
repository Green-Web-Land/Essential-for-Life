<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Read before choosing">
<rect width="1000" height="500" fill="#f4f8fc"/>
<text x="40" y="54" fill="#122d49" font-family="Arial,sans-serif" font-size="30" font-weight="700">Read before choosing</text>
<rect x="40" y="90" width="450" height="122" rx="16" fill="#ffffff" stroke="#8aabc5" stroke-width="2"/><text x="62" y="130" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#174b75">1. Identify</text><text x="62" y="173" font-family="Arial,sans-serif" font-size="21" fill="#223647">What is the product for?</text>
<rect x="510" y="90" width="450" height="122" rx="16" fill="#ffffff" stroke="#8aabc5" stroke-width="2"/><text x="532" y="130" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#174b75">2. Directions</text><text x="532" y="173" font-family="Arial,sans-serif" font-size="21" fill="#223647">Read the original instructions.</text>
<rect x="40" y="235" width="450" height="122" rx="16" fill="#ffffff" stroke="#8aabc5" stroke-width="2"/><text x="62" y="275" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#174b75">3. Warnings</text><text x="62" y="318" font-family="Arial,sans-serif" font-size="21" fill="#223647">Notice limits and cautions.</text>
<rect x="510" y="235" width="450" height="122" rx="16" fill="#ffffff" stroke="#8aabc5" stroke-width="2"/><text x="532" y="275" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#174b75">4. Clarify</text><text x="532" y="318" font-family="Arial,sans-serif" font-size="21" fill="#223647">A missing label is a gap.</text>
<text x="40" y="423" font-family="Arial,sans-serif" font-size="21" fill="#223647">Use the fictional labels on paper. Do not test unknown products.</text>
<text x="40" y="470" font-family="Arial,sans-serif" font-size="17" fill="#536777">Everyday Personal Care • Text equivalent accompanies each diagram.</text></svg>
