<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="General handwashing sequence">
<rect width="1000" height="500" fill="#f4f8fc"/><text x="40" y="54" fill="#122d49" font-family="Arial,sans-serif" font-size="30" font-weight="700">Handwashing: arrange the steps on paper</text>
<rect x="40" y="90" width="290" height="122" rx="16" fill="#ffffff" stroke="#8aabc5" stroke-width="2"/><text x="56" y="130" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#174b75">1. Wet</text><text x="56" y="173" font-family="Arial,sans-serif" font-size="19" fill="#223647">Use suitable water.</text>
<rect x="350" y="90" width="290" height="122" rx="16" fill="#ffffff" stroke="#8aabc5" stroke-width="2"/><text x="366" y="130" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#174b75">2. Soap</text><text x="366" y="173" font-family="Arial,sans-serif" font-size="19" fill="#223647">Apply soap.</text>
<rect x="660" y="90" width="290" height="122" rx="16" fill="#ffffff" stroke="#8aabc5" stroke-width="2"/><text x="676" y="130" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#174b75">3. Rub</text><text x="676" y="173" font-family="Arial,sans-serif" font-size="19" fill="#223647">All surfaces: at least 20 sec.</text>
<rect x="40" y="235" width="290" height="122" rx="16" fill="#ffffff" stroke="#8aabc5" stroke-width="2"/><text x="56" y="275" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#174b75">4. Rinse</text><text x="56" y="318" font-family="Arial,sans-serif" font-size="19" fill="#223647">Use clean water.</text>
<rect x="350" y="235" width="290" height="122" rx="16" fill="#ffffff" stroke="#8aabc5" stroke-width="2"/><text x="366" y="275" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#174b75">5. Dry</text><text x="366" y="318" font-family="Arial,sans-serif" font-size="19" fill="#223647">Use a clean towel.</text>
<rect x="660" y="235" width="290" height="122" rx="16" fill="#ffffff" stroke="#8aabc5" stroke-width="2"/><text x="676" y="275" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#174b75">6. Tap</text><text x="676" y="318" font-family="Arial,sans-serif" font-size="19" fill="#223647">Use the towel for the tap.</text>
<text x="40" y="423" font-family="Arial,sans-serif" font-size="21" fill="#223647">General PHAC guidance; see lesson 3 for coverage, assumptions and source.</text>
<text x="40" y="470" font-family="Arial,sans-serif" font-size="17" fill="#536777">A paper exercise does not demonstrate real-world technique.</text></svg>
