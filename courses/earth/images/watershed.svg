<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Two fictional watershed accounts"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#356b85"/></marker></defs><rect width="1000" height="500" fill="#f2f8fa"/><text x="35" y="50" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#123e54">Two fictional watershed accounts</text><text x="35" y="90" font-family="Arial,sans-serif" font-size="21" fill="#203b49">One boundary and interval; same arbitrary water-volume units.</text><rect x="35" y="125" width="200" height="85" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="51" y="159" font-family="Arial,sans-serif" font-size="23" fill="#203b49">Rain input</text><text x="51" y="191" font-family="Arial,sans-serif" font-size="18" fill="#203b49">A 100  /  B 100</text><rect x="290" y="125" width="300" height="85" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="306" y="159" font-family="Arial,sans-serif" font-size="23" fill="#203b49">Atmospheric output</text><text x="306" y="191" font-family="Arial,sans-serif" font-size="18" fill="#203b49">A 35  /  B 25</text><rect x="665" y="125" width="300" height="85" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="681" y="159" font-family="Arial,sans-serif" font-size="23" fill="#203b49">Outlet output</text><text x="681" y="191" font-family="Arial,sans-serif" font-size="18" fill="#203b49">A 45  /  B 65</text><text x="45" y="275" font-family="Arial,sans-serif" font-size="25" fill="#203b49">A: 100 − 35 − 45 = 20 storage increase</text><text x="45" y="325" font-family="Arial,sans-serif" font-size="25" fill="#203b49">B: 100 − 25 − 65 = 10 storage increase</text><text x="45" y="385" font-family="Arial,sans-serif" font-size="23" fill="#203b49">Final storage is unknown without the initial amount.</text><text x="35" y="438" font-family="Arial,sans-serif" font-size="20" fill="#203b49">A larger interval output alone establishes neither a flood nor unsafe water.</text><text x="35" y="478" font-family="Arial,sans-serif" font-size="16" fill="#203b49">How Earth Works • Simplified teaching diagram • Not to scale</text></svg>
