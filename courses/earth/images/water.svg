<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Water can follow different routes"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#356b85"/></marker></defs><rect width="1000" height="500" fill="#f2f8fa"/><text x="35" y="50" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#123e54">Water can follow different routes</text><rect x="330" y="90" width="340" height="85" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="346" y="124" font-family="Arial,sans-serif" font-size="23" fill="#203b49">Atmosphere</text><text x="346" y="156" font-family="Arial,sans-serif" font-size="18" fill="#203b49">vapour and clouds</text><rect x="55" y="285" width="250" height="85" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="71" y="319" font-family="Arial,sans-serif" font-size="23" fill="#203b49">Land surface / soil</text><rect x="380" y="285" width="250" height="85" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="396" y="319" font-family="Arial,sans-serif" font-size="23" fill="#203b49">Groundwater</text><rect x="710" y="285" width="250" height="85" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="726" y="319" font-family="Arial,sans-serif" font-size="23" fill="#203b49">Stream</text><line x1="370" y1="175" x2="210" y2="280" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><text x="90" y="225" font-family="Arial,sans-serif" font-size="18" fill="#203b49">precipitation</text><line x1="305" y1="325" x2="380" y2="325" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="375" font-family="Arial,sans-serif" font-size="18" fill="#203b49">recharge</text><line x1="630" y1="325" x2="710" y2="325" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><text x="640" y="375" font-family="Arial,sans-serif" font-size="18" fill="#203b49">discharge</text><path d="M 180 285 Q 160 70 330 115" fill="none" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="95" font-family="Arial,sans-serif" font-size="17" fill="#203b49">evaporation /</text><text x="40" y="120" font-family="Arial,sans-serif" font-size="17" fill="#203b49">transpiration</text><path d="M 300 290 Q 500 205 735 285" fill="none" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><text x="455" y="237" font-family="Arial,sans-serif" font-size="18" fill="#203b49">runoff</text><text x="35" y="438" font-family="Arial,sans-serif" font-size="20" fill="#203b49">Selected paths only; arrows do not show travel time or water quality.</text><text x="35" y="478" font-family="Arial,sans-serif" font-size="16" fill="#203b49">How Earth Works • Simplified teaching diagram • Not to scale</text></svg>
