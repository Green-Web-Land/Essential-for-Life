<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Earth systems connect"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#356b85"/></marker></defs><rect width="1000" height="500" fill="#f2f8fa"/><text x="35" y="50" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#123e54">Earth systems connect</text><rect x="55" y="110" width="250" height="85" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="71" y="144" font-family="Arial,sans-serif" font-size="23" fill="#203b49">Atmosphere</text><text x="71" y="176" font-family="Arial,sans-serif" font-size="18" fill="#203b49">air</text><rect x="375" y="110" width="250" height="85" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="391" y="144" font-family="Arial,sans-serif" font-size="23" fill="#203b49">Hydrosphere</text><text x="391" y="176" font-family="Arial,sans-serif" font-size="18" fill="#203b49">water</text><rect x="695" y="110" width="250" height="85" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="711" y="144" font-family="Arial,sans-serif" font-size="23" fill="#203b49">Cryosphere</text><text x="711" y="176" font-family="Arial,sans-serif" font-size="18" fill="#203b49">ice and snow</text><rect x="210" y="290" width="250" height="85" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="226" y="324" font-family="Arial,sans-serif" font-size="23" fill="#203b49">Geosphere</text><text x="226" y="356" font-family="Arial,sans-serif" font-size="18" fill="#203b49">solid Earth</text><rect x="550" y="290" width="250" height="85" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="566" y="324" font-family="Arial,sans-serif" font-size="23" fill="#203b49">Biosphere</text><text x="566" y="356" font-family="Arial,sans-serif" font-size="18" fill="#203b49">life</text><line x1="305" y1="152" x2="375" y2="152" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><line x1="695" y1="152" x2="625" y2="152" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><line x1="500" y1="195" x2="365" y2="290" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><line x1="570" y1="195" x2="650" y2="290" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><line x1="460" y1="330" x2="550" y2="330" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="85" font-family="Arial,sans-serif" font-size="23" fill="#203b49">Selected connections; arrows do not quantify a flow.</text><text x="35" y="438" font-family="Arial,sans-serif" font-size="20" fill="#203b49">These categories overlap and interact; Earth is not a biological organism.</text><text x="35" y="478" font-family="Arial,sans-serif" font-size="16" fill="#203b49">How Earth Works • Simplified teaching diagram • Not to scale</text></svg>
