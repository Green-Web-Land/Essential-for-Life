<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Selected surface processes"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#356b85"/></marker></defs><rect width="1000" height="500" fill="#f2f8fa"/><text x="35" y="50" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#123e54">Selected surface processes</text><rect x="40" y="145" width="280" height="85" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="56" y="179" font-family="Arial,sans-serif" font-size="23" fill="#203b49">Weathering</text><text x="56" y="211" font-family="Arial,sans-serif" font-size="18" fill="#203b49">rock changes in place</text><rect x="360" y="145" width="280" height="85" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="376" y="179" font-family="Arial,sans-serif" font-size="23" fill="#203b49">Erosion</text><text x="376" y="211" font-family="Arial,sans-serif" font-size="18" fill="#203b49">material is transported</text><rect x="680" y="145" width="280" height="85" rx="12" fill="white" stroke="#6597aa" stroke-width="2"/><text x="696" y="179" font-family="Arial,sans-serif" font-size="23" fill="#203b49">Deposition</text><text x="696" y="211" font-family="Arial,sans-serif" font-size="18" fill="#203b49">material accumulates</text><line x1="320" y1="188" x2="360" y2="188" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><line x1="640" y1="188" x2="680" y2="188" stroke="#356b85" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="305" font-family="Arial,sans-serif" font-size="24" fill="#203b49">Material may be stored, moved again or follow another route.</text><text x="65" y="355" font-family="Arial,sans-serif" font-size="24" fill="#203b49">Plate processes also shape land over varied timescales.</text><text x="35" y="438" font-family="Arial,sans-serif" font-size="20" fill="#203b49">This selected pathway is not the entire rock cycle.</text><text x="35" y="478" font-family="Arial,sans-serif" font-size="16" fill="#203b49">How Earth Works • Simplified teaching diagram • Not to scale</text></svg>
